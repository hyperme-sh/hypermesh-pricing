name: release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

# Public repository; the existing main channel advances independently of consumers.
# Downloadable image provenance remains the verified digest and source tag.
permissions:
  contents: read

jobs:
  image:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Queue pushes of the same ref. A second main push must not retag :main
    # between this job's docker push and its registry inspect.
    concurrency:
      group: hypermesh-pricing-image-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t hypermesh-pricing:candidate .
      - name: Check startup and /healthz
        run: bash scripts/smoke-image.sh hypermesh-pricing:candidate
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image and advance channel
        id: push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/publish_image.py
      - name: Set package visibility to public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # GITHUB_TOKEN usually cannot PATCH org package visibility. A miss
          # must not fail the release: the image is already pushed. Do not
          # write the step summary here; the digest line above stays last.
          path="/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/hypermesh-pricing"
          set +e
          body="$(gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "$path" \
            -f visibility=public 2>&1)"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "package visibility: public"
            exit 0
          fi
          echo "WARNING: could not set the GHCR package visibility to public. The image was already pushed." >&2
          echo "WARNING: one-time fix: set the package public in the org package settings, or link it to the repo." >&2
          printf '%s\n' "$body" >&2
          exit 0
